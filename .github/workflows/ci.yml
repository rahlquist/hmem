name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  test:
    name: Python 3.14 test suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Run unit tests and generate JUnit report
        run: python -m pilot.junit_runner --output test-results.xml

      - name: Upload JUnit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-test-results
          path: test-results.xml
          if-no-files-found: error
          retention-days: 30

      - name: Publish browsable test results
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: Test Results
          path: test-results.xml
          reporter: java-junit
          list-suites: all
          list-tests: all
          fail-on-error: true

  benchmark:
    name: Measured provider comparison
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Run three isolated measured comparisons
        run: make pilot-provider-comparison

      - name: Publish comparison summary
        if: always()
        run: cat pilot-out/provider-comparison/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload raw benchmark results and comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: measured-provider-comparison
          path: |
            pilot-out/provider-comparison-runs/runs
            pilot-out/provider-comparison/report.md
            pilot-out/provider-comparison/report.json
          if-no-files-found: error
          retention-days: 30
